<!DOCTYPE html>
<!--
  =====================================================================
  VoltEdge — catalog.html (Product catalog)
  ---------------------------------------------------------------------
  Grid of all four products, rendered by js/catalog.js from
  js/products.js. Each card shows the image, category, name,
  description, PKR price, a "Products worth" block (cost, price,
  profit, margin) and an "Add to cart" button that updates the header
  cart counter. A filter bar narrows the grid by category.
  Each card has an id (e.g. #earbuds) so home-page links land on it.
  Header, footer and icons (<span data-icon>) are filled by js/main.js.
  =====================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog | VoltEdge</title>
  <meta name="description" content="Browse VoltEdge tech accessories: wireless earbuds, phone covers, 20W chargers and laptop stands, priced in PKR." />
  <meta name="theme-color" content="#15803D" />

  <!-- Favicon: the VoltEdge logo mark -->
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

  <!-- Inter font (falls back to the system font stack if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Shared stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Shared header/nav (filled by main.js) -->
  <header id="site-header"></header>

  <main id="main">
    <!-- Page intro -->
    <section class="page-hero">
      <div class="container heading-with-icon">
        <span class="icon-circle icon-circle-lg"><span data-icon="tag" data-size="26"></span></span>
        <div>
          <span class="eyebrow">Shop</span>
          <h1>Product catalog</h1>
          <p>Every VoltEdge accessory with its price in PKR. Free delivery,
            1-year warranty and cash on delivery on all items.</p>
        </div>
      </div>
    </section>

    <section class="section section-tight-top">
      <div class="container">
        <!-- Filter bar: chips built by catalog.js from CATEGORIES -->
        <div class="filter-bar">
          <div class="filter-chips" id="filter-chips" role="group" aria-label="Filter by category"></div>
          <p class="filter-count" id="filter-count" aria-live="polite"></p>
        </div>

        <!-- Product grid: cards built by catalog.js from PRODUCTS -->
        <div class="catalog-grid" id="catalog-grid"></div>
      </div>
    </section>
  </main>

  <!-- Shared footer (filled by main.js) -->
  <footer id="site-footer"></footer>

  <!-- Scripts: icons, product data, shared behaviour, then catalog page -->
  <script src="js/icons.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
