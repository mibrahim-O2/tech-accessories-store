<!DOCTYPE html>
<!--
  =====================================================================
  VoltEdge — keywords.html (Keyword planner)
  ---------------------------------------------------------------------
  Shows Google Keyword Planner research: keyword, avg monthly searches,
  competition and top-of-page bid (PKR), plus an audience-interest
  summary. Built in Phase 5; for now it is a placeholder.
  Header, footer and icons (<span data-icon>) are filled by js/main.js.
  =====================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyword Planner | VoltEdge</title>
  <meta name="description" content="Google Keyword Planner research for VoltEdge tech accessories in Pakistan." />

  <!-- Favicon: the VoltEdge logo mark -->
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

  <!-- Inter font (falls back to the system font stack if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Shared stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Shared header/nav (filled by main.js) -->
  <header id="site-header"></header>

  <main>
    <!-- Page intro -->
    <section class="page-hero">
      <div class="container heading-with-icon">
        <span class="icon-circle icon-circle-lg"><span data-icon="search" data-size="26"></span></span>
        <div>
          <span class="eyebrow">Research</span>
          <h1>Keyword planner</h1>
          <p>What our customers search for on Google.</p>
        </div>
      </div>
    </section>

    <!-- Keyword table (Phase 5) -->
    <section class="section section-tight-top">
      <div class="container">
        <div class="placeholder">Keyword planner table coming in Phase 5.</div>
      </div>
    </section>
  </main>

  <!-- Shared footer (filled by main.js) -->
  <footer id="site-footer"></footer>

  <!-- Scripts: icons, product data, then shared behaviour -->
  <script src="js/icons.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
